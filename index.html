<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTimer - Preline UI</title>
    
    <!-- Tailwind CSS (с конфигурацией для Preline) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Обязательно для темной темы Preline
            theme: {
                extend: {}
            }
        }
    </script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Backend & Libs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Icons & Preline UI Script -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        /* Шрифты для превью */
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;800&family=Comic+Neue:wght@700&family=Roboto:wght@700;900&family=Open+Sans:wght@700;800&family=Oswald:wght@700&family=Raleway:wght@800;900&family=Nunito:wght@800;900&family=Playfair+Display:wght@700;900&family=Caveat:wght@700&family=Rubik:wght@700;900&family=Pacifico&family=Yanone+Kaffeesatz:wght@700&family=Comfortaa:wght@700&family=Ruslan+Display&family=Kelly+Slab&family=Roboto+Slab:wght@700;900&family=Lobster&family=Alice&family=PT+Sans:wght@700&display=swap');
        
        body { 
            background-color: #0a0a0a; /* Темный фон Preline */
            color: #d4d4d4; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif;
        }
        
        /* Кастомный Preline Скроллбар */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #404040; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background-color: #525252; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-neutral-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const socket = typeof io !== 'undefined' ? io() : { emit: ()=>{}, on: ()=>{}, off: ()=>{} }; // Fallback for preview

        const supabaseUrl = 'https://lqjagftaeejdufwwvjwd.supabase.co';
        const supabaseKey = 'sb_publishable_6-9IBhMX9CMVbIackZAJ9g_UUk5FDqx'; 
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const knownGiftsCache = new Set();
        socket.on('check-and-save-gift', async (gift) => {
            if (!gift || !gift.gift_id || knownGiftsCache.has(gift.gift_id)) return;
            try {
                const { error } = await supabase.from('gift_library').upsert([{ gift_id: gift.gift_id, name: gift.name, icon: gift.icon, cost: gift.cost }], { onConflict: 'gift_id' });
                if (!error) knownGiftsCache.add(gift.gift_id);
            } catch (err) { }
        });

        // Универсальный Toggle (Переключатель) в стиле Preline
        const Toggle = ({ checked, onChange, label, subtext }) => (
            <label className="flex items-center justify-between cursor-pointer w-full p-4 bg-white border border-gray-200 rounded-xl shadow-sm dark:bg-neutral-800 dark:border-neutral-700">
                <div className="flex flex-col">
                    <span className="text-sm text-gray-800 font-semibold dark:text-neutral-200">{label}</span>
                    {subtext && <span className="text-xs text-gray-500 dark:text-neutral-400 mt-0.5">{subtext}</span>}
                </div>
                <div className="relative inline-block">
                    <input type="checkbox" className="peer sr-only" checked={checked} onChange={onChange} />
                    <div className="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-neutral-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-neutral-600 peer-checked:bg-blue-600"></div>
                </div>
            </label>
        );

        // Универсальный Input в стиле Preline
        const Input = ({ type = "text", value, onChange, placeholder, className = "" }) => (
            <input 
                type={type} value={value} onChange={onChange} placeholder={placeholder} 
                className={`py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600 ${className}`} 
            />
        );

        function GiftModal({ isOpen, onClose, onSelect }) {
            const [gifts, setGifts] = useState([]); const [search, setSearch] = useState(''); const [isLoading, setIsLoading] = useState(false);
            useEffect(() => {
                if (!isOpen) return; setIsLoading(true);
                supabase.from('gift_library').select('*').then(({ data }) => { 
                    setIsLoading(false);
                    if (data && data.length > 0) {
                        const grouped = data.reduce((acc, curr) => {
                            const giftName = curr.name || 'Без названия';
                            if (!acc[giftName]) { acc[giftName] = { ...curr, name: giftName, ids: [curr.gift_id] }; } 
                            else if (!acc[giftName].ids.includes(curr.gift_id)) { acc[giftName].ids.push(curr.gift_id); }
                            return acc;
                        }, {});
                        setGifts(Object.values(grouped).sort((a, b) => (a.cost || 0) - (b.cost || 0)));
                    }
                });
            }, [isOpen]);

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[80] bg-gray-900 bg-opacity-60 backdrop-blur-sm transition-all flex items-center justify-center p-4">
                    <div className="bg-white border shadow-sm rounded-xl dark:bg-neutral-800 dark:border-neutral-700 w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden animate-fade-in-up">
                        <div className="flex justify-between items-center py-4 px-5 border-b dark:border-neutral-700">
                            <h3 className="font-bold text-gray-800 dark:text-white text-lg">Библиотека подарков</h3>
                            <button onClick={onClose} className="w-8 h-8 flex justify-center items-center rounded-lg text-gray-500 hover:bg-gray-100 focus:outline-none dark:hover:bg-neutral-700 dark:text-neutral-400">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div className="p-4 border-b dark:border-neutral-700 bg-gray-50 dark:bg-neutral-800/50">
                            <div className="relative">
                                <div className="absolute inset-y-0 start-0 flex items-center pointer-events-none z-20 ps-4">
                                    <i className="fa-solid fa-magnifying-glass text-gray-400"></i>
                                </div>
                                <input type="text" placeholder="Поиск подарка..." value={search} onChange={e => setSearch(e.target.value)} className="py-3 px-4 ps-11 block w-full border-gray-200 rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400" />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
                            {isLoading ? <div className="col-span-full flex justify-center py-10"><div className="animate-spin inline-block size-6 border-[3px] border-current border-t-transparent text-blue-600 rounded-full" role="status" aria-label="loading"></div></div> : 
                            gifts.filter(g => (g.name || '').toLowerCase().includes(search.toLowerCase())).map((g, idx) => (
                                <div key={idx} onClick={() => { onSelect(g); onClose(); setSearch(''); }} className="cursor-pointer bg-white border border-gray-200 rounded-xl p-3 flex flex-col items-center hover:shadow-md hover:border-blue-500 transition-all dark:bg-neutral-900 dark:border-neutral-700 dark:hover:border-blue-500 group">
                                    <img src={g.icon} alt={g.name} className="w-12 h-12 object-contain mb-2 group-hover:scale-110 transition-transform" />
                                    <span className="text-[11px] text-center font-semibold leading-tight text-gray-800 dark:text-neutral-300 line-clamp-2">{g.name}</span>
                                    <span className="text-[10px] text-blue-600 dark:text-blue-400 mt-1 font-bold">{g.cost || 0} монет</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function AuthScreen({ onLogin }) {
            const [email, setEmail] = useState(''); const [password, setPassword] = useState(''); const [confirmPassword, setConfirmPassword] = useState('');
            const [isLogin, setIsLogin] = useState(true); const [error, setError] = useState(''); const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault(); setError(''); setLoading(true);
                if (isLogin) {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) setError(error.message); else onLogin(data.user);
                } else {
                    if (password !== confirmPassword) { setError('Пароли не совпадают!'); setLoading(false); return; }
                    const { data, error } = await supabase.auth.signUp({ email, password });
                    if (error) { setError(error.message); } 
                    else {
                        const loginResult = await supabase.auth.signInWithPassword({ email, password });
                        if (loginResult.error) { setError('Регистрация успешна, подтвердите email.'); setIsLogin(true); } 
                        else { onLogin(loginResult.data.user); }
                    }
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 dark:bg-neutral-900">
                    <div className="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-sm border border-gray-200 dark:bg-neutral-800 dark:border-neutral-700">
                        <div className="text-center">
                            <h2 className="text-3xl font-bold text-gray-800 dark:text-white">TikTimer <span className="text-blue-600">PRO</span></h2>
                            <p className="mt-2 text-sm text-gray-600 dark:text-neutral-400">{isLogin ? 'Войдите в свою учетную запись' : 'Создайте новую учетную запись'}</p>
                        </div>
                        
                        {error && (
                            <div className="bg-red-50 border border-red-200 text-sm text-red-800 rounded-lg p-4 dark:bg-red-800/10 dark:border-red-900 dark:text-red-500 animate-shake" role="alert">
                                <span className="font-bold">Ошибка:</span> {error}
                            </div>
                        )}

                        <form className="mt-8 space-y-6" onSubmit={handleSubmit}>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium mb-2 dark:text-white">Email адрес</label>
                                    <Input type="email" value={email} onChange={e => setEmail(e.target.value)} required />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2 dark:text-white">Пароль</label>
                                    <Input type="password" value={password} onChange={e => setPassword(e.target.value)} required />
                                </div>
                                {!isLogin && (
                                    <div>
                                        <label className="block text-sm font-medium mb-2 dark:text-white">Подтверждение пароля</label>
                                        <Input type="password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} required />
                                    </div>
                                )}
                            </div>
                            <button type="submit" disabled={loading} className="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
                                {loading ? <div className="animate-spin inline-block size-4 border-[2px] border-current border-t-transparent text-white rounded-full"></div> : (isLogin ? 'Войти' : 'Зарегистрироваться')}
                            </button>
                        </form>
                        <div className="text-center">
                            <button onClick={() => { setIsLogin(!isLogin); setError(''); }} className="text-sm text-blue-600 decoration-2 hover:underline font-medium dark:text-blue-500">
                                {isLogin ? 'Нет аккаунта? Зарегистрируйтесь' : 'Уже есть аккаунт? Войти'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function PaymentWidget({ user, onVerified }) {
            const [amount, setAmount] = useState(null); const [wallet, setWallet] = useState('');
            const [checking, setChecking] = useState(false); const [creating, setCreating] = useState(false);
            const [error, setError] = useState(''); const qrRef = useRef(null);

            useEffect(() => {
                const onCreated = (data) => { 
                    setCreating(false); setAmount(data.amount); setWallet(data.wallet);
                    setTimeout(() => {
                        if (qrRef.current) {
                            qrRef.current.innerHTML = '';
                            new QRCode(qrRef.current, { text: `ton://transfer/${data.wallet}?amount=${data.amount * 1000000000}&text=TikTimer`, width: 150, height: 150, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H });
                        }
                    }, 100);
                };
                const onSuccess = (data) => { setChecking(false); onVerified(data.expireDate); };
                const onNotFound = () => { setChecking(false); setError('Платеж не найден. Проверьте точную сумму.'); };
                const onError = (data) => { setChecking(false); setCreating(false); setError(data.message); };

                socket.on('payment-created', onCreated); socket.on('payment-success', onSuccess); socket.on('payment-not-found', onNotFound); socket.on('payment-error', onError);
                return () => { socket.off('payment-created', onCreated); socket.off('payment-success', onSuccess); socket.off('payment-not-found', onNotFound); socket.off('payment-error', onError); };
            }, [onVerified]);

            return (
                <div className="flex flex-col items-center text-center w-full max-w-sm mx-auto">
                    {!amount ? (
                        <div className="w-full">
                            <div className="mb-6">
                                <span className="inline-flex items-center gap-1.5 py-1.5 px-3 rounded-full text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-800/30 dark:text-blue-500 mb-3"><i className="fa-brands fa-telegram"></i> Оплата TON</span>
                                <h3 className="text-xl font-bold text-gray-800 dark:text-neutral-200">Продление подписки</h3>
                                <p className="text-sm text-gray-500 dark:text-neutral-400 mt-2">Доступ на 30 дней. Стоимость 50 USDT (в TON).</p>
                            </div>
                            <button onClick={() => { setCreating(true); setError(''); socket.emit('create-payment', user.id); }} disabled={creating} className="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
                                {creating ? <div className="animate-spin inline-block size-4 border-[2px] border-current border-t-transparent rounded-full"></div> : 'Сгенерировать счет'}
                            </button>
                        </div>
                    ) : (
                        <div className="w-full flex flex-col items-center animate-fade-in-up">
                            <div className="bg-white p-3 rounded-xl shadow-sm border border-gray-200 mb-4" ref={qrRef}></div>
                            <div className="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 mb-4 dark:bg-neutral-900/50 dark:border-neutral-700">
                                <span className="block text-xs text-gray-500 dark:text-neutral-400 mb-1 uppercase tracking-wider font-semibold">Сумма к оплате</span>
                                <span className="block text-2xl font-bold text-green-600 dark:text-green-500 font-mono">{amount} USDT</span>
                                <span className="block text-[10px] text-red-500 mt-1 font-medium">*Переведите ТОЧНО эту сумму!</span>
                            </div>
                            <a href={`ton://transfer/${wallet}?amount=${amount * 1000000000}&text=TikTimer`} className="w-full mb-3 py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-[#3390ec] text-white hover:bg-[#2a7bcf]">
                                <i className="fa-solid fa-wallet"></i> Открыть Tonkeeper
                            </a>
                            <button onClick={() => { setChecking(true); setError(''); socket.emit('verify-payment', { uid: user.id, amount }); }} disabled={checking} className="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-700">
                                {checking ? 'Проверяем...' : 'Я оплатил(а), проверить'}
                            </button>
                        </div>
                    )}
                    {error && (
                        <div className="mt-4 w-full bg-red-50 border border-red-200 text-sm text-red-800 rounded-lg p-4 dark:bg-red-800/10 dark:border-red-900 dark:text-red-500 animate-shake">
                            {error}
                        </div>
                    )}
                </div>
            );
        }

        function SubscriptionScreen({ user, onLogout, onVerified }) {
            return (
                <div className="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50 dark:bg-neutral-900">
                    <div className="max-w-4xl w-full bg-white border border-gray-200 rounded-2xl shadow-sm dark:bg-neutral-800 dark:border-neutral-700 flex flex-col md:flex-row overflow-hidden">
                        <div className="w-full md:w-1/2 p-8 md:p-12 border-b md:border-b-0 md:border-e border-gray-200 dark:border-neutral-700 bg-gray-50 dark:bg-neutral-800/50 flex flex-col justify-between">
                            <div>
                                <h1 className="text-3xl font-bold text-gray-800 dark:text-white mb-6">Получите полный доступ к <span className="text-blue-600 dark:text-blue-500">PRO версии</span></h1>
                                <ul className="space-y-4 text-sm text-gray-600 dark:text-neutral-400">
                                    <li className="flex gap-x-3"><i className="fa-solid fa-check text-blue-600 mt-0.5"></i> Неограниченное время работы сессий</li>
                                    <li className="flex gap-x-3"><i className="fa-solid fa-check text-blue-600 mt-0.5"></i> Интерактивная рулетка времени и призов</li>
                                    <li className="flex gap-x-3"><i className="fa-solid fa-check text-blue-600 mt-0.5"></i> Кастомные триггеры для любых подарков</li>
                                    <li className="flex gap-x-3"><i className="fa-solid fa-check text-blue-600 mt-0.5"></i> Поддержка DonationAlerts, DonatePay, DonateX</li>
                                </ul>
                            </div>
                            <div className="mt-10 border-t border-gray-200 dark:border-neutral-700 pt-6 flex justify-between items-center text-sm">
                                <span className="text-gray-500 dark:text-neutral-500 truncate mr-4">{user.email}</span>
                                <button onClick={onLogout} className="text-red-500 hover:text-red-600 font-medium">Выйти</button>
                            </div>
                        </div>
                        <div className="w-full md:w-1/2 p-8 md:p-12 flex items-center justify-center">
                            <PaymentWidget user={user} onVerified={onVerified} />
                        </div>
                    </div>
                </div>
            );
        }

        function MainApp({ user, subUntil, setSubUntil, onLogout }) {
            const [activeTab, setActiveTab] = useState('connect');
            const [status, setStatus] = useState({ tt: { text: 'Ожидание', isActive: false, isStreamLive: false }, da: 'Ожидание', dp: 'Ожидание', dx: 'Ожидание' });
            const [isRunning, setIsRunning] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, key: null });
            const [showRenew, setShowRenew] = useState(false);

            const daysLeft = subUntil ? Math.max(0, Math.ceil((new Date(subUntil) - new Date()) / (1000 * 60 * 60 * 24))) : 0;

            const defConfig = {
                username: '', ttApiKey: '', daToken: '', dpApiKey: '', dxToken: '', 
                initialTime: 60, bonusEnabled: true, bonusMin: 60, bonusMax: 300,
                isPenaltyEnabled: true, penaltyAmount: 600, penaltyThreshold: 300, giftPenalty: null,
                isSetTimeEnabled: true, giftSetTime: null, setTimeValue: 300, 
                isResetEnabled: true, giftReset: null,
                isMultiplierGiftEnabled: true, multiplierValue: 2, multiplierDuration: 60, giftMultiplier: null,
                isDebuffGiftEnabled: false, debuffValue: 2, debuffDuration: 60, giftDebuff: null,
                likesEnabled: true, likeThreshold: 100, likeTime: 10, likesRouletteEnabled: false, likesRouletteThreshold: 100000, 
                subsEnabled: true, subTime: 180, customGifts: [], giftRoulette: null, rouletteSlots: [], rouletteGiftAddsCost: false,
                styles: { fontFamily: 'Inter', timerColor: '#ffffff', timerGlow: 0.4, enableStroke: true, buffColor: '#34d399', debuffColor: '#f43f5e', floatPlusColor: '#34d399', floatMinusColor: '#ef4444', buffCardBg: '#10b981', debuffCardBg: '#e11d48', rouletteBg: '#0f172a', likeAlertColor: '#f43f5e', followAlertColor: '#34d399' }
            };

            const [config, setConfig] = useState(defConfig);
            const [savedConfig, setSavedConfig] = useState(defConfig);
            const hasChanges = JSON.stringify(savedConfig) !== JSON.stringify(config);

            const formatPayload = (data) => ({
                ...data,
                giftPenaltyIds: data.giftPenalty?.ids || [], giftSetTimeIds: data.giftSetTime?.ids || [], giftResetIds: data.giftReset?.ids || [], giftRouletteIds: data.giftRoulette?.ids || [], giftMultiplierIds: data.giftMultiplier?.ids || [], giftDebuffIds: data.giftDebuff?.ids || [],
                customTriggers: data.customGifts.filter(cg => cg.gift).map(cg => ({ ids: cg.gift.ids || [], type: cg.type, value: cg.value, threshold: cg.threshold || 0, isEnabled: cg.isEnabled }))
            });

            useEffect(() => {
                socket.emit('join-room', user.id);
                supabase.from('ttimer_settings').select('config').eq('user_id', user.id).single().then(({ data }) => {
                    if (data && data.config) {
                        const merged = { ...defConfig, ...data.config, styles: { ...defConfig.styles, ...(data.config.styles || {}) } };
                        setConfig(merged); setSavedConfig(merged);
                        socket.emit('update-settings', formatPayload(merged));
                    }
                });

                socket.on('status-update', s => setStatus(s));
                socket.on('timer-tick', s => setIsRunning(s.isRunning));
                const onMessage = (e) => { if (e.data && e.data.type === 'da_auth') { const hash = new URLSearchParams(e.data.hash); const token = hash.get('access_token'); if (token) socket.emit('connect-da-token', token); } };
                window.addEventListener('message', onMessage);
                return () => { socket.off('status-update'); socket.off('timer-tick'); window.removeEventListener('message', onMessage); };
            }, [user.id]);

            const handleSave = async () => { 
                await supabase.from('ttimer_settings').upsert({ user_id: user.id, config });
                setSavedConfig(config); 
                socket.emit('update-settings', formatPayload(config));

                                        <div>
                                            <label className="block text-sm font-bold mb-2 dark:text-white"><i className="fa-solid fa-dharmachakra text-purple-500 mr-2"></i>Рулетка</label>
                                            <div className="flex rounded-lg shadow-sm">
                                                <input type="text" readOnly value={`${window.location.origin}/rullete.html?uid=${user.id}`} className="py-3 px-4 block w-full border-gray-200 shadow-sm rounded-s-lg text-sm font-mono focus:z-10 focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400" />
                                                <button onClick={() => navigator.clipboard.writeText(`${window.location.origin}/rullete.html?uid=${user.id}`)} className="w-[2.875rem] h-[2.875rem] shrink-0 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-e-md border border-transparent bg-purple-600 text-white hover:bg-purple-700 disabled:opacity-50 disabled:pointer-events-none" title="Копировать">
                                                    <i className="fa-solid fa-copy"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {}
                    {hasChanges && (
                        <div id="save-toast" className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] bg-white border border-gray-200 shadow-lg rounded-full p-2 flex items-center gap-2 dark:bg-neutral-800 dark:border-neutral-700 animate-fade-in-up" style={{ fontFamily: 'Inter' }}>
                            <span className="text-sm font-medium text-gray-800 dark:text-white px-3 hidden sm:block">Есть несохраненные изменения</span>
                            <button onClick={handleSave} className="py-2 px-5 inline-flex items-center gap-x-2 text-sm font-semibold rounded-full border border-transparent bg-teal-500 text-white hover:bg-teal-600 transition-colors">
                                <i className="fa-solid fa-check"></i> Сохранить
                            </button>
                            <button onClick={handleCancel} className="w-9 h-9 inline-flex justify-center items-center rounded-full border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800 transition-colors" title="Отменить">
                                <i className="fa-solid fa-rotate-left"></i>
                            </button>
                        </div>
                    )}

                    {}
                    {showRenew && (
                        <div className="fixed inset-0 z-[80] bg-gray-900 bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 w-full max-w-md relative dark:bg-neutral-800 dark:border-neutral-700 animate-fade-in-up">
                                <button onClick={() => setShowRenew(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-neutral-300 transition">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <PaymentWidget user={user} onVerified={(date) => { setSubUntil(date); setShowRenew(false); }} />
                            </div>
                        </div>
                    )}

                    <GiftModal isOpen={modal.isOpen} onClose={() => setModal({ isOpen: false, key: null })} onSelect={(gift) => {
                        if (modal.key.startsWith('custom_')) { const id = modal.key.split('_')[1]; setConfig(p => ({...p, customGifts: p.customGifts.map(cg => cg.id === id ? { ...cg, gift } : cg)})); } 
                        else { setConfig({ ...config, [modal.key]: gift }); }
                    }} />
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null); 
            const [loading, setLoading] = useState(true);
            const [subUntil, setSubUntil] = useState(null);

            const checkSub = async (uid) => {
                const { data } = await supabase.from('ttimer_settings').select('subscription_until').eq('user_id', uid).single();
                if (data) setSubUntil(data.subscription_until); else setSubUntil(null);
                setLoading(false);
            };

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => { 
                    const u = session?.user ?? null; setUser(u);
                    if (u) checkSub(u.id); else setLoading(false);
                });
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => { 
                    const u = session?.user ?? null; setUser(u);
                    if (u) checkSub(u.id); else { setSubUntil(null); setLoading(false); }
                });
                return () => subscription.unsubscribe();
            }, []);

            const isSubbed = subUntil && new Date(subUntil) > new Date();

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50 dark:bg-neutral-900">
                    <div className="animate-spin inline-block size-8 border-[3px] border-current border-t-transparent text-blue-600 rounded-full dark:text-blue-500" role="status"></div>
                </div>
            );
            if (!user) return <AuthScreen onLogin={(u) => { setLoading(true); checkSub(u.id); }} />;
            if (!isSubbed) return <SubscriptionScreen user={user} onLogout={() => supabase.auth.signOut()} onVerified={(date) => setSubUntil(date)} />;
            
            return <MainApp user={user} subUntil={subUntil} setSubUntil={setSubUntil} onLogout={() => supabase.auth.signOut()} />;
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root')); 
        root.render(<App />);
    </script>
</body>
</html>
