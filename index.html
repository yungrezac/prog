<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTimer PRO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>window.io = window.io || function() { return { on: ()=>{}, emit: ()=>{}, off: ()=>{} }; };</script>
    <script src="/socket.io/socket.io.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vivus@0.4.6/dist/vivus.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' },
                        dark: { 900: '#0b0f19', 800: '#111827', 700: '#1f2937' }
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Bebas+Neue&family=Montserrat:wght@400;800&family=Comic+Neue:wght@700&family=Roboto:wght@700;900&family=Open+Sans:wght@700;800&family=Oswald:wght@700&family=Raleway:wght@800;900&family=Nunito:wght@800;900&family=Playfair+Display:wght@700;900&family=Caveat:wght@700&family=Rubik:wght@700;900&family=Pacifico&family=Yanone+Kaffeesatz:wght@700&family=Comfortaa:wght@700&family=Ruslan+Display&family=Kelly+Slab&family=Roboto+Slab:wght@700;900&family=Lobster&family=Alice&family=PT+Sans:wght@700&display=swap');
        
        body { 
            background-color: #0b0f19; 
            color: #f8fafc; 
            overflow: hidden; 
            transition: font-family 0.3s ease;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(17, 24, 39, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }

        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-glass {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        #anime-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none;
        }
        .anime-particle {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(99,102,241,0.3) 0%, rgba(99,102,241,0) 70%);
        }

        .tab-active-bg { background: linear-gradient(90deg, rgba(99,102,241,0.15) 0%, transparent 100%); }
    </style>
</head>
<body>
    <div id="anime-background"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useLayoutEffect } = React;
        const socket = (typeof io !== 'undefined') ? io() : { on: ()=>{}, emit: ()=>{}, off: ()=>{} };

        const supabaseUrl = 'https://lqjagftaeejdufwwvjwd.supabase.co';
        const supabaseKey = 'sb_publishable_6-9IBhMX9CMVbIackZAJ9g_UUk5FDqx'; 
        const supabase = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

        const knownGiftsCache = new Set();
        socket.on('check-and-save-gift', async (gift) => {
            if (!supabase || !gift || !gift.gift_id || knownGiftsCache.has(gift.gift_id)) return;
            try {
                const { error } = await supabase.from('gift_library').upsert([{ gift_id: gift.gift_id, name: gift.name, icon: gift.icon, cost: gift.cost }], { onConflict: 'gift_id' });
                if (!error) knownGiftsCache.add(gift.gift_id);
            } catch (err) { }
        });

        // Вспомогательный хук для GSAP
        function useGsapModal(isOpen, modalRef) {
            useEffect(() => {
                if (isOpen && modalRef.current) {
                    gsap.fromTo(modalRef.current, { scale: 0.9, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.2)" });
                }
            }, [isOpen]);
        }

        function GiftModal({ isOpen, onClose, onSelect }) {
            const [gifts, setGifts] = useState([]); 
            const [search, setSearch] = useState(''); 
            const [isLoading, setIsLoading] = useState(false);
            const modalRef = useRef(null);
            
            useGsapModal(isOpen, modalRef);

            useEffect(() => {
                if (!isOpen || !supabase) return; 
                setIsLoading(true);
                supabase.from('gift_library').select('*').then(({ data }) => { 
                    setIsLoading(false);
                    if (data && data.length > 0) {
                        const grouped = data.reduce((acc, curr) => {
                            const giftName = curr.name || 'Без названия';
                            if (!acc[giftName]) { acc[giftName] = { ...curr, name: giftName, ids: [curr.gift_id] }; } 
                            else if (!acc[giftName].ids.includes(curr.gift_id)) { acc[giftName].ids.push(curr.gift_id); }
                            return acc;
                        }, {});
                        setGifts(Object.values(grouped).sort((a, b) => (a.cost || 0) - (b.cost || 0)));
                    }
                });
            }, [isOpen]);

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-dark-900/80 flex items-center justify-center p-6 z-[100] backdrop-blur-md" style={{ fontFamily: 'Inter' }}>
                    <div ref={modalRef} className="glass-panel rounded-3xl p-6 w-full max-w-4xl h-[85vh] flex flex-col">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-purple-400">Библиотека подарков</h2>
                            <button onClick={onClose} className="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-all"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        <input type="text" placeholder="Поиск подарка..." value={search} onChange={e => setSearch(e.target.value)} className="w-full input-glass rounded-xl px-4 py-4 mb-6 text-white outline-none" />
                        
                        <div className="flex-1 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-4 pr-2 custom-scrollbar">
                            {isLoading ? <div className="col-span-full flex flex-col items-center mt-10 text-brand-400"><i className="fa-solid fa-circle-notch fa-spin text-3xl mb-2"></i>Загрузка...</div> : 
                            gifts.filter(g => (g.name || '').toLowerCase().includes(search.toLowerCase())).map((g, idx) => (
                                <div key={idx} onClick={() => { onSelect(g); onClose(); setSearch(''); }} className="cursor-pointer bg-white/5 p-4 rounded-2xl hover:bg-brand-600/20 transition-all duration-300 flex flex-col items-center group border border-transparent hover:border-brand-500/50 hover:-translate-y-1">
                                    <img src={g.icon} alt={g.name} className="w-16 h-16 object-contain mb-3 group-hover:scale-110 transition-transform duration-300 drop-shadow-[0_0_10px_rgba(255,255,255,0.2)]" />
                                    <span className="text-sm text-center font-bold leading-tight text-slate-200">{g.name}</span>
                                    <span className="text-xs text-brand-400 mt-1 font-bold px-2 py-1 bg-brand-500/10 rounded-md">{g.cost || 0} монет</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function AuthScreen({ onLogin }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [isLogin, setIsLogin] = useState(true);
            const [error, setError] = useState('');
            
            const formRef = useRef(null);
            const logoRef = useRef(null);

            useEffect(() => {
                const container = document.getElementById('anime-background');
                container.innerHTML = '';
                for (let i = 0; i < 20; i++) {
                    const div = document.createElement('div');
                    div.classList.add('anime-particle');
                    const size = Math.random() * 200 + 50;
                    div.style.width = `${size}px`; div.style.height = `${size}px`;
                    container.appendChild(div);
                }
                anime({ targets: '.anime-particle', translateX: () => anime.random(-window.innerWidth/2, window.innerWidth/2), translateY: () => anime.random(-window.innerHeight/2, window.innerHeight/2), scale: () => anime.random(0.5, 2), opacity: () => anime.random(0.1, 0.4), duration: () => anime.random(3000, 8000), easing: 'easeInOutQuad', direction: 'alternate', loop: true });

                new Vivus(logoRef.current, { duration: 100, type: 'oneByOne', animTimingFunction: Vivus.EASE_OUT }, () => {
                    logoRef.current.classList.add('logo-filled');
                });

                gsap.fromTo(formRef.current.children, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, stagger: 0.1, ease: "power3.out", delay: 0.5 });
                return () => { container.innerHTML = ''; }; 
            }, []);

            useEffect(() => { gsap.fromTo(".auth-input-group", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }); }, [isLogin]);

            const handleSubmit = async (e) => {
                e.preventDefault(); setError('');
                if (!supabase) return; 
                anime({ targets: '.submit-btn', scale: [1, 0.95, 1], duration: 300, easing: 'easeInOutQuad' });

                if (isLogin) {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) setError(error.message); else onLogin(data.user);
                } else {
                    if (password !== confirmPassword) { setError('Пароли не совпадают!'); return; }
                    const { data, error } = await supabase.auth.signUp({ email, password });
                    if (error) { setError(error.message); } 
                    else {
                        const loginResult = await supabase.auth.signInWithPassword({ email, password });
                        if (loginResult.error) { setError('Регистрация успешна, но требуется подтверждение.'); setIsLogin(true); } 
                        else { onLogin(loginResult.data.user); }
                    }
                }
            };

            return (
                <div className="h-screen w-screen flex items-center justify-center bg-transparent z-10 relative" style={{ fontFamily: 'Inter' }}>
                    <div className="glass-panel p-10 rounded-[2.5rem] w-full max-w-md relative overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.5)]">
                        <div className="flex justify-center mb-6">
                            <svg ref={logoRef} viewBox="0 0 100 100" className="w-24 h-24 stroke-brand-400 stroke-[3px] fill-transparent transition-all duration-1000 drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]">
                                <style>{`.logo-filled { fill: url(#grad1); stroke-width: 0; }`}</style>
                                <defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style={{stopColor:"#818cf8", stopOpacity:1}} /><stop offset="100%" style={{stopColor:"#c084fc", stopOpacity:1}} /></linearGradient></defs>
                                <path d="M50 5 L80 40 L55 40 L60 95 L20 55 L45 55 Z" strokeLinejoin="round" strokeLinecap="round" />
                            </svg>
                        </div>
                        <h1 className="text-4xl font-black text-center text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-purple-400 mb-8 tracking-tight">TikTimer</h1>
                        <form ref={formRef} onSubmit={handleSubmit} className="flex flex-col gap-5">
                            {error && <div className="bg-rose-500/10 border border-rose-500/50 text-rose-400 p-4 rounded-2xl text-sm text-center">{error}</div>}
                            <div className="auth-input-group relative">
                                <i className="fa-solid fa-envelope absolute left-4 top-4 text-slate-500"></i>
                                <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full input-glass rounded-2xl pl-12 pr-4 py-4 outline-none text-white" required />
                            </div>
                            <div className="auth-input-group relative">
                                <i className="fa-solid fa-lock absolute left-4 top-4 text-slate-500"></i>
                                <input type="password" placeholder="Пароль" value={password} onChange={e => setPassword(e.target.value)} className="w-full input-glass rounded-2xl pl-12 pr-4 py-4 outline-none text-white" required />
                            </div>
                            {!isLogin && (
                                <div className="auth-input-group relative">
                                    <i className="fa-solid fa-shield-check absolute left-4 top-4 text-slate-500"></i>
                                    <input type="password" placeholder="Подтвердите пароль" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full input-glass rounded-2xl pl-12 pr-4 py-4 outline-none text-white" required />
                                </div>
                            )}
                            <button type="submit" className="submit-btn bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 font-bold py-4 rounded-2xl mt-2 transition-all shadow-[0_0_20px_rgba(99,102,241,0.4)]">
                                {isLogin ? 'Войти в систему' : 'Создать аккаунт'}
                            </button>
                            <p className="text-center text-slate-400 mt-2 text-sm cursor-pointer hover:text-white transition-colors" onClick={() => { setIsLogin(!isLogin); setError(''); setConfirmPassword(''); }}>
                                {isLogin ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти'}
                            </p>
                        </form>
                    </div>
                </div>
            );
        }

        function PaymentWidget({ user, onVerified }) {
            const [amount, setAmount] = useState(null);
            const [wallet, setWallet] = useState('');
            const [checking, setChecking] = useState(false);
            const [creating, setCreating] = useState(false);
            const [error, setError] = useState('');
            const qrRef = useRef(null);

            useEffect(() => {
                const onCreated = (data) => { 
                    setCreating(false); setAmount(data.amount); setWallet(data.wallet);
                    setTimeout(() => {
                        if (qrRef.current) {
                            qrRef.current.innerHTML = '';
                            new QRCode(qrRef.current, { text: `ton://transfer/${data.wallet}?amount=${data.amount * 1000000000}&text=TikTimer`, width: 160, height: 160, colorDark : "#ffffff", colorLight : "#00000000", correctLevel : QRCode.CorrectLevel.H });
                        }
                    }, 100);
                };
                const onSuccess = (data) => { setChecking(false); onVerified(data.expireDate); };
                const onNotFound = () => { setChecking(false); setError('Платеж не найден. Убедитесь, что перевели точную сумму.'); };
                const onError = (data) => { setChecking(false); setCreating(false); setError(data.message); };

                socket.on('payment-created', onCreated); socket.on('payment-success', onSuccess); socket.on('payment-not-found', onNotFound); socket.on('payment-error', onError);
                return () => { socket.off('payment-created', onCreated); socket.off('payment-success', onSuccess); socket.off('payment-not-found', onNotFound); socket.off('payment-error', onError); };
            }, [onVerified]);

            return (
                <div className="flex flex-col items-center text-center w-full max-w-sm mx-auto">
                    <div className="w-20 h-20 bg-brand-500/10 flex items-center justify-center rounded-[2rem] mb-6 border border-brand-500/20 shadow-[0_0_30px_rgba(99,102,241,0.15)] relative"><i className="fa-brands fa-telegram text-4xl text-brand-400 absolute"></i></div>
                    <h3 className="text-2xl font-black mb-2 text-white">Оплата Подписки</h3>
                    <p className="text-slate-400 mb-8 text-sm">Доступ выдается на 30 дней. При продлении время суммируется.</p>
                    
                    {!amount ? (
                        <button onClick={() => { setCreating(true); setError(''); socket.emit('create-payment', user.id); }} disabled={creating} className="w-full bg-gradient-to-r from-brand-600 to-brand-500 py-4 rounded-2xl font-bold text-white transition-all flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(99,102,241,0.3)]">
                            {creating ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Подготовка...</> : <><i className="fa-brands fa-telegram"></i> Оплатить 50 USDT (TON)</>}
                        </button>
                    ) : (
                        <div className="w-full flex flex-col items-center">
                            <div className="bg-white/10 p-4 rounded-3xl mb-6 shadow-xl border border-white/10 backdrop-blur-md" ref={qrRef}></div>
                            <div className="input-glass w-full p-5 rounded-2xl mb-6 flex flex-col gap-1 text-left relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-brand-500"></div>
                                <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">К оплате (Строго):</span>
                                <span className="text-brand-300 font-mono text-3xl font-black">{amount} <span className="text-lg">USDT</span></span>
                            </div>
                            <a href={`ton://transfer/${wallet}?amount=${amount * 1000000000}&text=TikTimer`} className="w-full bg-[#3390ec] hover:bg-[#2a7bcf] text-white py-4 rounded-2xl font-bold transition-all flex items-center justify-center gap-3 mb-4 shadow-[0_10px_20px_rgba(51,144,236,0.3)]"><i className="fa-solid fa-wallet text-xl"></i> Открыть Tonkeeper</a>
                            <button onClick={() => { setChecking(true); setError(''); socket.emit('verify-payment', { uid: user.id, amount }); }} disabled={checking} className="w-full bg-white/5 hover:bg-white/10 text-emerald-400 py-4 rounded-2xl font-bold transition-all border border-white/10">{checking ? <><i className="fa-solid fa-circle-notch fa-spin mr-2"></i> Проверка...</> : 'Я оплатил, проверить'}</button>
                        </div>
                    )}
                    {error && <div className="mt-6 p-4 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-rose-400 text-sm font-bold w-full backdrop-blur-sm">{error}</div>}
                </div>
            );
        }

        function SubscriptionScreen({ user, onLogout, onVerified }) {
            const screenRef = useRef(null);
            useEffect(() => { gsap.fromTo(screenRef.current, { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }); }, []);
            return (
                <div className="min-h-screen w-screen flex items-center justify-center p-4 sm:p-8 relative z-10" style={{ fontFamily: 'Inter' }}>
                    <div ref={screenRef} className="glass-panel rounded-[2.5rem] flex flex-col md:flex-row overflow-hidden w-full max-w-5xl shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-white/10">
                        <div className="w-full md:w-1/2 bg-gradient-to-br from-brand-900/40 to-dark-900/80 p-12 flex flex-col justify-between relative overflow-hidden">
                            <div className="absolute top-[-20%] left-[-20%] w-96 h-96 bg-brand-500/20 rounded-full blur-[100px] pointer-events-none"></div>
                            <div className="absolute bottom-[-20%] right-[-20%] w-96 h-96 bg-purple-500/20 rounded-full blur-[100px] pointer-events-none"></div>
                            <div className="relative z-10">
                                <div className="flex items-center gap-4 mb-10">
                                    <div className="w-14 h-14 bg-brand-500/20 rounded-2xl flex items-center justify-center border border-brand-500/30 backdrop-blur-md"><i className="fa-solid fa-bolt text-brand-400 text-2xl"></i></div>
                                    <h2 className="text-2xl font-black tracking-widest text-white">TikTimer</h2>
                                </div>
                                <h1 className="text-4xl sm:text-5xl font-black text-white leading-tight mb-8">Открой всю мощь с <br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-purple-400 drop-shadow-lg">PRO версией</span></h1>
                                <ul className="space-y-5 mb-8">
                                    {['Неограниченное время сессий', 'Интерактивная рулетка призов', 'Собственные триггеры событий', 'Поддержка DonationAlerts'].map((text, i) => (
                                        <li key={i} className="flex items-center gap-4 text-slate-300 font-medium text-lg"><div className="w-8 h-8 rounded-full bg-emerald-500/10 flex items-center justify-center border border-emerald-500/20"><i className="fa-solid fa-check text-emerald-400 text-sm"></i></div>{text}</li>
                                    ))}
                                </ul>
                            </div>
                            <div className="relative z-10 text-sm text-slate-400 bg-white/5 p-4 rounded-2xl backdrop-blur-md border border-white/5 inline-flex items-center justify-between">
                                <span>Аккаунт: <strong className="text-slate-200">{user?.email || 'test@test.com'}</strong></span>
                                <button onClick={onLogout} className="text-rose-400 hover:text-rose-300 font-bold transition">Выйти <i className="fa-solid fa-arrow-right-from-bracket ml-1"></i></button>
                            </div>
                        </div>
                        <div className="w-full md:w-1/2 p-12 bg-dark-900/50 flex flex-col items-center justify-center border-l border-white/5 backdrop-blur-xl relative">
                            <PaymentWidget user={user || {id: 1}} onVerified={onVerified} />
                        </div>
                    </div>
                </div>
            );
        }

        function MainApp({ user, subUntil, setSubUntil, onLogout }) {
            const [activeTab, setActiveTab] = useState('connect');
            const [status, setStatus] = useState({ tt: { text: 'Ожидание', isActive: false, isStreamLive: false }, da: 'Ожидание', dp: 'Ожидание', dx: 'Ожидание' });
            const [isRunning, setIsRunning] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, key: null });
            const [showRenew, setShowRenew] = useState(false);
            
            const contentRef = useRef(null);

            useLayoutEffect(() => {
                if (contentRef.current) { gsap.fromTo(contentRef.current.children, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.05, ease: "power2.out" }); }
            }, [activeTab]);

            const daysLeft = subUntil ? Math.max(0, Math.ceil((new Date(subUntil) - new Date()) / (1000 * 60 * 60 * 24))) : 30; // 30 for demo

            const defConfig = {
                username: '', ttApiKey: '', daToken: '', dpApiKey: '', dxToken: '', 
                initialTime: 60, bonusEnabled: true, bonusMin: 60, bonusMax: 300,
                isPenaltyEnabled: true, penaltyAmount: 600, penaltyThreshold: 300, giftPenalty: null,
                isSetTimeEnabled: true, giftSetTime: null, setTimeValue: 300, 
                isResetEnabled: true, giftReset: null,
                isMultiplierGiftEnabled: true, multiplierValue: 2, multiplierDuration: 60, giftMultiplier: null,
                isDebuffGiftEnabled: false, debuffValue: 2, debuffDuration: 60, giftDebuff: null,

                                                    <option value="Ruslan Display" className="bg-dark-800">Ruslan Display (Славянский)</option>
                                                    <option value="Kelly Slab" className="bg-dark-800">Kelly Slab (Квадратный)</option>
                                                    <option value="Roboto Slab" className="bg-dark-800">Roboto Slab (Засечки)</option>
                                                    <option value="Lobster" className="bg-dark-800">Lobster (Ретро скрипт)</option>
                                                    <option value="Alice" className="bg-dark-800">Alice (Сказка)</option>
                                                    <option value="PT Sans" className="bg-dark-800">PT Sans (Строгий 2)</option>
                                                </select>
                                                <div className="mt-3 text-[10px] text-brand-300 font-bold uppercase tracking-widest" style={{fontFamily: 'Inter'}}>Шрифт применяется к панели сразу для предпросмотра!</div>
                                            </div>
                                            
                                            <div className="flex items-center justify-between bg-dark-900/50 p-4 rounded-xl border border-white/5" style={{fontFamily: 'Inter'}}>
                                                <label className="text-sm text-slate-300 font-bold">Основной Цвет Таймера</label>
                                                <div className="w-12 h-12 rounded-xl overflow-hidden border-2 border-white/20 shadow-[0_0_15px_rgba(255,255,255,0.2)] relative">
                                                    <input type="color" value={config.styles.timerColor} onChange={e=>setCfgStyle('timerColor', e.target.value)} className="absolute -top-2 -left-2 w-16 h-16 cursor-pointer" />
                                                </div>
                                            </div>
                                            
                                            <div className="bg-dark-900/50 p-5 rounded-xl border border-white/5" style={{fontFamily: 'Inter'}}>
                                                <div className="flex justify-between mb-4"><label className="text-sm text-slate-300 font-bold">Сила свечения (Glow)</label><span className="text-brand-400 font-black">{config.styles.timerGlow}</span></div>
                                                <input type="range" min="0" max="1" step="0.1" value={config.styles.timerGlow} onChange={e=>setCfgStyle('timerGlow', parseFloat(e.target.value))} className="w-full cursor-pointer accent-brand-500 h-2 bg-dark-800 rounded-full appearance-none outline-none" />
                                            </div>
                                            
                                            <div className="flex items-center justify-between bg-dark-900/50 p-5 rounded-xl border border-white/5 cursor-pointer hover:border-brand-500/30 transition-colors" onClick={() => setCfgStyle('enableStroke', !config.styles.enableStroke)} style={{fontFamily: 'Inter'}}>
                                                <div className="flex flex-col"><span className="font-bold text-white">Черная обводка</span><span className="text-xs text-slate-500 mt-1">Улучшает читаемость на светлом фоне</span></div>
                                                <div className={`w-12 h-6 rounded-full relative transition-colors ${config.styles.enableStroke ? 'bg-brand-500' : 'bg-slate-700'}`}><div className={`w-4 h-4 rounded-full bg-white absolute top-1 transition-transform ${config.styles.enableStroke ? 'translate-x-7' : 'translate-x-1'}`}></div></div>
                                            </div>
                                        </div>

                                        <div className="space-y-6">
                                            <div className="glass-panel p-8 rounded-3xl space-y-4">
                                                <h3 className="font-bold text-emerald-400 border-b border-white/10 pb-4 text-xl flex items-center"><i className="fa-solid fa-bell mr-3"></i>Цвета Уведомлений</h3>
                                                {[
                                                    { label: 'Цвет Плюса (+ сек)', key: 'floatPlusColor', def: '#22c55e' },
                                                    { label: 'Цвет Минуса (- сек)', key: 'floatMinusColor', def: '#ef4444' },
                                                    { label: 'Цвет текста "ЛАЙКИ"', key: 'likeAlertColor', def: '#f43f5e' },
                                                    { label: 'Цвет текста "ПОДПИСКА"', key: 'followAlertColor', def: '#34d399' }
                                                ].map(c => (
                                                    <div key={c.key} className="flex items-center justify-between bg-dark-900/30 p-3 rounded-xl border border-white/5 hover:bg-dark-900/50 transition-colors" style={{fontFamily: 'Inter'}}>
                                                        <label className="text-sm text-slate-300 font-bold">{c.label}</label>
                                                        <div className="w-10 h-10 rounded-lg overflow-hidden border border-white/20 relative shrink-0"><input type="color" value={config.styles[c.key] || c.def} onChange={e=>setCfgStyle(c.key, e.target.value)} className="absolute -top-2 -left-2 w-16 h-16 cursor-pointer" /></div>
                                                    </div>
                                                ))}
                                            </div>
                                            
                                            <div className="glass-panel p-8 rounded-3xl space-y-4">
                                                <h3 className="font-bold text-purple-400 border-b border-white/10 pb-4 text-xl flex items-center"><i className="fa-solid fa-dice mr-3"></i>Рулетка и Карточки</h3>
                                                {[
                                                    { label: 'Фон полосы вращения', key: 'rouletteBg', def: '#0f172a' },
                                                    { label: 'Фон карточки Ускорения', key: 'buffCardBg', def: '#10b981' },
                                                    { label: 'Фон карточки Замедления', key: 'debuffCardBg', def: '#e11d48' }
                                                ].map(c => (
                                                    <div key={c.key} className="flex items-center justify-between bg-dark-900/30 p-3 rounded-xl border border-white/5 hover:bg-dark-900/50 transition-colors" style={{fontFamily: 'Inter'}}>
                                                        <label className="text-sm text-slate-300 font-bold">{c.label}</label>
                                                        <div className="w-10 h-10 rounded-lg overflow-hidden border border-white/20 relative shrink-0"><input type="color" value={config.styles[c.key] || c.def} onChange={e=>setCfgStyle(c.key, e.target.value)} className="absolute -top-2 -left-2 w-16 h-16 cursor-pointer" /></div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Вкладка OBS */}
                            {activeTab === 'obs' && (
                                <div className="space-y-6">
                                    <h2 className="text-4xl font-black text-white mb-8 tracking-tight">Ссылки для OBS Browser</h2>
                                    <div className="glass-panel p-8 rounded-3xl space-y-8 relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-64 h-64 bg-brand-500/10 rounded-full blur-[80px] pointer-events-none"></div>
                                        
                                        <div className="bg-dark-900/50 border border-brand-500/30 p-4 rounded-xl flex gap-4 items-center">
                                            <div className="w-12 h-12 bg-brand-500/20 rounded-full flex items-center justify-center shrink-0"><i className="fa-solid fa-circle-info text-brand-400 text-xl"></i></div>
                                            <p className="text-slate-300 text-sm" style={{fontFamily: 'Inter'}}>Эти ссылки уникальны для вашего аккаунта (UID: <span className="font-mono font-bold text-brand-400 bg-brand-500/10 px-2 py-0.5 rounded">{user.id}</span>). Добавьте их как источник "Браузер" в OBS Studio.</p>
                                        </div>
                                        
                                        <div>
                                            <span className="font-bold text-white mb-3 flex items-center text-xl" style={{fontFamily: 'Inter'}}><div className="w-10 h-10 bg-indigo-500/20 rounded-xl flex items-center justify-center mr-3 border border-indigo-500/30"><i className="fa-solid fa-clock text-indigo-400"></i></div> Основной Таймер</span>
                                            <div className="flex gap-3">
                                                <input type="text" readOnly value={`${window.location.origin}/timer.html?uid=${user.id}`} className="flex-1 input-glass rounded-xl px-5 py-4 text-sm text-brand-200 outline-none font-mono selection:bg-brand-500/50" />
                                                <button onClick={() => { navigator.clipboard.writeText(`${window.location.origin}/timer.html?uid=${user.id}`); anime({targets: '#copy1', scale: [1, 0.9, 1.1, 1], duration: 400}); }} id="copy1" className="bg-indigo-600 hover:bg-indigo-500 px-8 rounded-xl text-white font-bold transition-colors shadow-lg flex items-center gap-2" style={{ fontFamily: 'Inter' }}><i className="fa-solid fa-copy"></i> Копировать</button>
                                            </div>
                                        </div>

                                        <div>
                                            <span className="font-bold text-white mb-3 flex items-center text-xl" style={{fontFamily: 'Inter'}}><div className="w-10 h-10 bg-purple-500/20 rounded-xl flex items-center justify-center mr-3 border border-purple-500/30"><i className="fa-solid fa-dice text-purple-400"></i></div> Колесо Рулетки</span>
                                            <div className="flex gap-3">
                                                <input type="text" readOnly value={`${window.location.origin}/rullete.html?uid=${user.id}`} className="flex-1 input-glass rounded-xl px-5 py-4 text-sm text-purple-200 outline-none font-mono selection:bg-purple-500/50" />
                                                <button onClick={() => { navigator.clipboard.writeText(`${window.location.origin}/rullete.html?uid=${user.id}`); anime({targets: '#copy2', scale: [1, 0.9, 1.1, 1], duration: 400}); }} id="copy2" className="bg-purple-600 hover:bg-purple-500 px-8 rounded-xl text-white font-bold transition-colors shadow-lg flex items-center gap-2" style={{ fontFamily: 'Inter' }}><i className="fa-solid fa-copy"></i> Копировать</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {}
                    {hasChanges && (
                        <div id="save-bar" className="absolute bottom-10 left-1/2 -translate-x-1/2 glass-panel p-3 rounded-full flex items-center gap-4 z-[90] border border-emerald-500/50 shadow-[0_15px_40px_rgba(16,185,129,0.3)]">
                            <div className="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 ml-1 shrink-0"><i className="fa-solid fa-floppy-disk"></i></div>
                            <span className="font-bold text-emerald-300 mr-2 whitespace-nowrap" style={{fontFamily: 'Inter'}}>Есть несохраненные изменения</span>
                            <button onClick={handleSave} className="px-8 py-3 bg-gradient-to-r from-emerald-500 to-emerald-400 hover:from-emerald-400 hover:to-emerald-300 text-dark-900 rounded-full font-black transition-all shadow-lg text-sm">СОХРАНИТЬ</button>
                            <button onClick={handleCancel} className="w-12 h-12 flex items-center justify-center bg-white/5 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 rounded-full transition-colors shrink-0"><i className="fa-solid fa-rotate-left"></i></button>
                        </div>
                    )}

                    {showRenew && (
                        <div className="fixed inset-0 z-[100] bg-dark-900/90 backdrop-blur-xl flex items-center justify-center p-4">
                            <div className="glass-panel rounded-3xl p-8 w-full max-w-md relative border border-white/10 shadow-[0_0_50px_rgba(0,0,0,0.8)]">
                                <button onClick={() => setShowRenew(false)} className="absolute top-6 right-6 w-10 h-10 bg-white/5 rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-colors hover:bg-white/10"><i className="fa-solid fa-xmark"></i></button>
                                <PaymentWidget user={user || {id:1}} onVerified={(date) => { setSubUntil(date); setShowRenew(false); }} />
                            </div>
                        </div>
                    )}

                    <GiftModal isOpen={modal.isOpen} onClose={() => setModal({ isOpen: false, key: null })} onSelect={(gift) => {
                        if (modal.key.startsWith('custom_')) { const id = modal.key.split('_')[1]; setConfig(p => ({...p, customGifts: p.customGifts.map(cg => cg.id === id ? { ...cg, gift } : cg)})); } 
                        else { setConfig({ ...config, [modal.key]: gift }); }
                    }} />
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null); 
            const [loading, setLoading] = useState(true);
            const [subUntil, setSubUntil] = useState(null);

            const checkSub = async (uid) => {
                if(!supabase) { setSubUntil(new Date(Date.now() + 86400000000).toISOString()); setLoading(false); return; } // Demo mode bypass
                const { data } = await supabase.from('ttimer_settings').select('subscription_until').eq('user_id', uid).single();
                if (data) setSubUntil(data.subscription_until);
                else setSubUntil(null);
                setLoading(false);
            };

            useEffect(() => {
                if (!supabase) {
                    // DEMO MODE if no DB:
                    setTimeout(() => { setUser({ id: 1, email: 'demo@demo.com' }); checkSub(1); }, 1500); 
                    return;
                }

                supabase.auth.getSession().then(({ data: { session } }) => { 
                    const u = session?.user ?? null;
                    setUser(u);
                    if (u) checkSub(u.id); else setLoading(false);
                });
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => { 
                    const u = session?.user ?? null;
                    setUser(u);
                    if (u) checkSub(u.id); else { setSubUntil(null); setLoading(false); }
                });
                return () => subscription.unsubscribe();
            }, []);

            const isSubbed = subUntil && new Date(subUntil) > new Date();

            if (loading) return (
                <div className="h-screen w-screen flex flex-col items-center justify-center bg-dark-900 text-brand-500" style={{fontFamily: 'Inter'}}>
                    <div className="relative w-20 h-20">
                        <div className="absolute inset-0 border-4 border-brand-500/20 rounded-full"></div>
                        <div className="absolute inset-0 border-4 border-t-brand-400 rounded-full animate-spin-slow" style={{ animationDuration: '1.5s' }}></div>
                        <div className="absolute inset-0 flex items-center justify-center"><i className="fa-solid fa-bolt text-2xl animate-pulse"></i></div>
                    </div>
                    <span className="text-xs font-black mt-8 tracking-widest uppercase text-slate-400 bg-white/5 px-4 py-2 rounded-full border border-white/5 shadow-inner">Инициализация...</span>
                </div>
            );
            
            if (!user) return <AuthScreen onLogin={(u) => { setLoading(true); checkSub(u.id); }} />;
            if (!isSubbed) return <SubscriptionScreen user={user} onLogout={() => {if(supabase) supabase.auth.signOut(); else setUser(null);}} onVerified={(date) => setSubUntil(date)} />;
            
            return <MainApp user={user} subUntil={subUntil} setSubUntil={setSubUntil} onLogout={() => {if(supabase) supabase.auth.signOut(); else setUser(null);}} />;
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root')); 
        root.render(<App />);
    </script>
</body>
</html>
