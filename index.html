<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTimer PRO</title>
    
    <!-- Скрипты React и Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Беканд скрипты пользователя -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Заглушка для io, чтобы UI не падал без сервера при предпросмотре -->
    <script>window.io = window.io || function() { return { on: ()=>{}, emit: ()=>{}, off: ()=>{} }; };</script>
    <script src="/socket.io/socket.io.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- БИБЛИОТЕКИ АНИМАЦИИ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vivus@0.4.6/dist/vivus.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' },
                        dark: { 900: '#0b0f19', 800: '#111827', 700: '#1f2937' }
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body { 
            background-color: #0b0f19; 
            color: #f8fafc; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif;
        }
        
        /* Стилизация скроллбара под новый дизайн */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(17, 24, 39, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }

        .glass-panel {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-glass {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            background: rgba(0, 0, 0, 0.4);
        }

        .tab-active { 
            background: linear-gradient(90deg, rgba(99,102,241,0.15) 0%, transparent 100%); 
            border-left: 3px solid #818cf8; 
            color: white; 
        }
        .tab-inactive { color: #6b7280; border-left: 3px solid transparent; }
        .tab-inactive:hover { color: #e5e7eb; background: rgba(255,255,255,0.02); }

        #anime-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none;
        }
        .anime-particle {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(99,102,241,0.4) 0%, rgba(99,102,241,0) 70%);
        }
    </style>
</head>
<body>
    <div id="anime-background"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useLayoutEffect } = React;
        // Безопасная инициализация для демо
        const socket = (typeof io !== 'undefined') ? io() : { on: ()=>{}, emit: ()=>{}, off: ()=>{} };

        const supabaseUrl = 'https://lqjagftaeejdufwwvjwd.supabase.co';
        const supabaseKey = 'sb_publishable_6-9IBhMX9CMVbIackZAJ9g_UUk5FDqx'; 
        const supabase = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

        const knownGiftsCache = new Set();
        socket.on('check-and-save-gift', async (gift) => {
            if (!supabase || !gift || !gift.gift_id || knownGiftsCache.has(gift.gift_id)) return;
            try {
                const { error } = await supabase.from('gift_library').upsert([{ gift_id: gift.gift_id, name: gift.name, icon: gift.icon, cost: gift.cost }], { onConflict: 'gift_id' });
                if (!error) knownGiftsCache.add(gift.gift_id);
            } catch (err) { }
        });

        // Вспомогательный хук для GSAP анимаций модалок
        function useGsapModal(isOpen, modalRef) {
            useEffect(() => {
                if (isOpen && modalRef.current) {
                    gsap.fromTo(modalRef.current, 
                        { scale: 0.9, opacity: 0, y: 20 }, 
                        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.5)" }
                    );
                }
            }, [isOpen]);
        }

        function GiftModal({ isOpen, onClose, onSelect }) {
            const [gifts, setGifts] = useState([]); 
            const [search, setSearch] = useState(''); 
            const [isLoading, setIsLoading] = useState(false);
            const modalRef = useRef(null);
            
            useGsapModal(isOpen, modalRef);

            useEffect(() => {
                if (!isOpen || !supabase) return; 
                setIsLoading(true);
                supabase.from('gift_library').select('*').then(({ data }) => { 
                    setIsLoading(false);
                    if (data && data.length > 0) {
                        const grouped = data.reduce((acc, curr) => {
                            const giftName = curr.name || 'Без названия';
                            if (!acc[giftName]) { acc[giftName] = { ...curr, name: giftName, ids: [curr.gift_id] }; } 
                            else if (!acc[giftName].ids.includes(curr.gift_id)) { acc[giftName].ids.push(curr.gift_id); }
                            return acc;
                        }, {});
                        setGifts(Object.values(grouped).sort((a, b) => (a.cost || 0) - (b.cost || 0)));
                    }
                });
            }, [isOpen]);

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-dark-900/80 flex items-center justify-center p-6 z-50 backdrop-blur-md">
                    <div ref={modalRef} className="glass-panel rounded-3xl p-6 w-full max-w-4xl h-[85vh] flex flex-col border border-white/10">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-purple-400">
                                Библиотека подарков
                            </h2>
                            <button onClick={onClose} className="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-all">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <input type="text" placeholder="Поиск подарка..." value={search} onChange={e => setSearch(e.target.value)} className="w-full input-glass rounded-xl px-4 py-4 mb-6 text-white outline-none" />
                        
                        <div className="flex-1 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-4 pr-2 custom-scrollbar">
                            {isLoading ? <div className="col-span-full text-center text-brand-400 mt-10 flex flex-col items-center"><i className="fa-solid fa-circle-notch fa-spin text-3xl mb-2"></i>Загрузка библиотеки...</div> : 
                            gifts.filter(g => (g.name || '').toLowerCase().includes(search.toLowerCase())).map((g, idx) => (
                                <div key={idx} onClick={() => { onSelect(g); onClose(); setSearch(''); }} className="cursor-pointer bg-white/5 p-4 rounded-2xl hover:bg-brand-600/20 transition-all duration-300 flex flex-col items-center group border border-transparent hover:border-brand-500/50 hover:-translate-y-1">
                                    <img src={g.icon} alt={g.name} className="w-16 h-16 object-contain mb-3 group-hover:scale-110 transition-transform duration-300 drop-shadow-[0_0_10px_rgba(255,255,255,0.2)]" />
                                    <span className="text-sm text-center font-bold leading-tight text-slate-200">{g.name}</span>
                                    <span className="text-xs text-brand-400 mt-1 font-bold px-2 py-1 bg-brand-500/10 rounded-md">{g.cost || 0} монет</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function AuthScreen({ onLogin }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [isLogin, setIsLogin] = useState(true);
            const [error, setError] = useState('');
            
            const formRef = useRef(null);
            const logoRef = useRef(null);

            // GSAP и Vivus анимации при загрузке
            useEffect(() => {
                // Инициализация фоновых частиц Anime.js
                const container = document.getElementById('anime-background');
                container.innerHTML = '';
                for (let i = 0; i < 20; i++) {
                    const div = document.createElement('div');
                    div.classList.add('anime-particle');
                    const size = Math.random() * 200 + 50;
                    div.style.width = `${size}px`;
                    div.style.height = `${size}px`;
                    container.appendChild(div);
                }

                anime({
                    targets: '.anime-particle',
                    translateX: () => anime.random(-window.innerWidth/2, window.innerWidth/2),
                    translateY: () => anime.random(-window.innerHeight/2, window.innerHeight/2),
                    scale: () => anime.random(0.5, 2),
                    opacity: () => anime.random(0.1, 0.4),
                    duration: () => anime.random(3000, 8000),
                    easing: 'easeInOutQuad',
                    direction: 'alternate',
                    loop: true
                });

                // Vivus отрисовка SVG логотипа
                new Vivus(logoRef.current, { 
                    duration: 100, 
                    type: 'oneByOne', 
                    animTimingFunction: Vivus.EASE_OUT 
                }, () => {
                    // После отрисовки заливаем градиентом (CSS handle)
                    logoRef.current.classList.add('logo-filled');
                });

                // GSAP Каскадное появление формы
                gsap.fromTo(formRef.current.children, 
                    { opacity: 0, y: 30 },
                    { opacity: 1, y: 0, duration: 0.8, stagger: 0.1, ease: "power3.out", delay: 0.5 }
                );

                return () => { container.innerHTML = ''; }; // cleanup
            }, []);

            // Анимация смены режима (Вход/Регистрация)
            useEffect(() => {
                gsap.fromTo(".auth-input-group", 
                    { opacity: 0, x: -20 }, 
                    { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }
                );
            }, [isLogin]);

            const handleSubmit = async (e) => {
                e.preventDefault(); 
                setError('');
                if (!supabase) return; // Защита
                
                // Добавим микроанимацию на кнопку при клике
                anime({ targets: '.submit-btn', scale: [1, 0.95, 1], duration: 300, easing: 'easeInOutQuad' });

                if (isLogin) {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) setError(error.message); else onLogin(data.user);
                } else {
                    if (password !== confirmPassword) { setError('Пароли не совпадают!'); return; }
                    const { data, error } = await supabase.auth.signUp({ email, password });
                    if (error) { setError(error.message); } 
                    else {
                        const loginResult = await supabase.auth.signInWithPassword({ email, password });
                        if (loginResult.error) { setError('Регистрация успешна, но требуется подтверждение.'); setIsLogin(true); } 
                        else { onLogin(loginResult.data.user); }
                    }
                }
            };

            return (
                <div className="h-screen w-screen flex items-center justify-center bg-transparent z-10 relative">
                    <div className="glass-panel p-10 rounded-[2.5rem] w-full max-w-md relative overflow-hidden">
                        
                        <div className="flex justify-center mb-6">
                            {/* SVG Логотип для анимации Vivus */}
                            <svg ref={logoRef} viewBox="0 0 100 100" className="w-24 h-24 stroke-brand-400 stroke-[3px] fill-transparent transition-all duration-1000 drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]">
                                <style>{`.logo-filled { fill: url(#grad1); stroke-width: 0; }`}</style>
                                <defs>
                                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" style={{stopColor:"#818cf8", stopOpacity:1}} />
                                        <stop offset="100%" style={{stopColor:"#c084fc", stopOpacity:1}} />
                                    </linearGradient>
                                </defs>
                                <path d="M50 5 L80 40 L55 40 L60 95 L20 55 L45 55 Z" strokeLinejoin="round" strokeLinecap="round" />
                            </svg>
                        </div>
                        
                        <h1 className="text-4xl font-black text-center text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-purple-400 mb-8 tracking-tight">TikTimer</h1>
                        
                        <form ref={formRef} onSubmit={handleSubmit} className="flex flex-col gap-5">
                            {error && <div className="bg-rose-500/10 border border-rose-500/50 text-rose-400 p-4 rounded-2xl text-sm text-center backdrop-blur-sm">{error}</div>}
                            
                            <div className="auth-input-group relative">
                                <i className="fa-solid fa-envelope absolute left-4 top-4 text-slate-500"></i>
                                <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full input-glass rounded-2xl pl-12 pr-4 py-4 outline-none text-white placeholder-slate-500" required />
                            </div>
                            
                            <div className="auth-input-group relative">
                                <i className="fa-solid fa-lock absolute left-4 top-4 text-slate-500"></i>
                                <input type="password" placeholder="Пароль" value={password} onChange={e => setPassword(e.target.value)} className="w-full input-glass rounded-2xl pl-12 pr-4 py-4 outline-none text-white placeholder-slate-500" required />
                            </div>
                            
                            {!isLogin && (
                                <div className="auth-input-group relative">
                                    <i className="fa-solid fa-shield-check absolute left-4 top-4 text-slate-500"></i>
                                    <input type="password" placeholder="Подтвердите пароль" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full input-glass rounded-2xl pl-12 pr-4 py-4 outline-none text-white placeholder-slate-500" required />
                                </div>
                            )}
                            
                            <button type="submit" className="submit-btn bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 font-bold py-4 rounded-2xl mt-2 transition-all shadow-[0_0_20px_rgba(99,102,241,0.4)] hover:shadow-[0_0_30px_rgba(99,102,241,0.6)]">
                                {isLogin ? 'Войти в систему' : 'Создать аккаунт'}
                            </button>
                            
                            <p className="text-center text-slate-400 mt-2 text-sm cursor-pointer hover:text-white transition-colors" onClick={() => { setIsLogin(!isLogin); setError(''); setConfirmPassword(''); }}>
                                {isLogin ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти'}
                            </p>
                        </form>
                    </div>
                </div>
            );
        }

        function PaymentWidget({ user, onVerified }) {
            const [amount, setAmount] = useState(null);
            const [wallet, setWallet] = useState('');
            const [checking, setChecking] = useState(false);
            const [creating, setCreating] = useState(false);
            const [error, setError] = useState('');
            const qrRef = useRef(null);

            useEffect(() => {
                const onCreated = (data) => { 
                    setCreating(false); setAmount(data.amount); setWallet(data.wallet);
                    setTimeout(() => {
                        if (qrRef.current) {
                            qrRef.current.innerHTML = '';
                            new QRCode(qrRef.current, { text: `ton://transfer/${data.wallet}?amount=${data.amount * 1000000000}&text=TikTimer`, width: 160, height: 160, colorDark : "#ffffff", colorLight : "#00000000", correctLevel : QRCode.CorrectLevel.H });
                        }
                    }, 100);
                };
                const onSuccess = (data) => { setChecking(false); onVerified(data.expireDate); };
                const onNotFound = () => { setChecking(false); setError('Платеж не найден. Убедитесь, что перевели точную сумму.'); };
                const onError = (data) => { setChecking(false); setCreating(false); setError(data.message); };

                socket.on('payment-created', onCreated);
                socket.on('payment-success', onSuccess);
                socket.on('payment-not-found', onNotFound);
                socket.on('payment-error', onError);
                
                return () => { 
                    socket.off('payment-created', onCreated); 
                    socket.off('payment-success', onSuccess); 
                    socket.off('payment-not-found', onNotFound); 
                    socket.off('payment-error', onError); 
                };
            }, [onVerified]);

            return (
                <div className="flex flex-col items-center text-center w-full max-w-sm mx-auto">
                    <div className="w-20 h-20 bg-brand-500/10 flex items-center justify-center rounded-[2rem] mb-6 border border-brand-500/20 shadow-[0_0_30px_rgba(99,102,241,0.15)] relative">
                        <i className="fa-brands fa-telegram text-4xl text-brand-400 absolute"></i>
                    </div>
                    <h3 className="text-2xl font-black mb-2 text-white tracking-tight">Оплата Подписки</h3>
                    <p className="text-slate-400 mb-8 text-sm">Доступ выдается на 30 дней. При продлении время суммируется.</p>
                    
                    {!amount ? (
                        <button onClick={() => { setCreating(true); setError(''); socket.emit('create-payment', user.id); }} disabled={creating} className="w-full bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 py-4 rounded-2xl font-bold text-white transition-all flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(99,102,241,0.3)]">
                            {creating ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Подготовка...</> : <><i className="fa-brands fa-telegram"></i> Оплатить 50 USDT (TON)</>}
                        </button>
                    ) : (
                        <div className="w-full flex flex-col items-center animate-fade-in-up">
                            <div className="bg-white/10 p-4 rounded-3xl mb-6 shadow-xl border border-white/10 backdrop-blur-md" ref={qrRef}></div>
                            <div className="input-glass w-full p-5 rounded-2xl mb-6 flex flex-col gap-1 text-left relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-brand-500"></div>
                                <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">К оплате (Строго):</span>
                                <span className="text-brand-300 font-mono text-3xl font-black">{amount} <span className="text-lg">USDT</span></span>
                            </div>
                            
                            <a href={`ton://transfer/${wallet}?amount=${amount * 1000000000}&text=TikTimer`} className="w-full bg-[#3390ec] hover:bg-[#2a7bcf] text-white py-4 rounded-2xl font-bold transition-all flex items-center justify-center gap-3 mb-4 shadow-[0_10px_20px_rgba(51,144,236,0.3)]">
                                <i className="fa-solid fa-wallet text-xl"></i> Открыть Tonkeeper
                            </a>
                            <button onClick={() => { setChecking(true); setError(''); socket.emit('verify-payment', { uid: user.id, amount }); }} disabled={checking} className="w-full bg-white/5 hover:bg-white/10 text-emerald-400 py-4 rounded-2xl font-bold transition-all border border-white/10">
                                {checking ? <><i className="fa-solid fa-circle-notch fa-spin mr-2"></i> Проверка...</> : 'Я оплатил, проверить'}
                            </button>
                        </div>
                    )}
                    {error && <div className="mt-6 p-4 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-rose-400 text-sm font-bold w-full backdrop-blur-sm">{error}</div>}
                </div>
            );
        }

        function SubscriptionScreen({ user, onLogout, onVerified }) {
            const screenRef = useRef(null);

            useEffect(() => {
                gsap.fromTo(screenRef.current, { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" });
            }, []);

            return (
                <div className="min-h-screen w-screen flex items-center justify-center p-4 sm:p-8 relative z-10">
                    <div ref={screenRef} className="glass-panel rounded-[2.5rem] flex flex-col md:flex-row overflow-hidden w-full max-w-5xl shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-white/10">
                        <div className="w-full md:w-1/2 bg-gradient-to-br from-brand-900/40 to-dark-900/80 p-12 flex flex-col justify-between relative overflow-hidden">
                            {/* Декоративные элементы */}
                            <div className="absolute top-[-20%] left-[-20%] w-96 h-96 bg-brand-500/20 rounded-full blur-[100px] pointer-events-none"></div>
                            <div className="absolute bottom-[-20%] right-[-20%] w-96 h-96 bg-purple-500/20 rounded-full blur-[100px] pointer-events-none"></div>
                            
                            <div className="relative z-10">
                                <div className="flex items-center gap-4 mb-10">
                                    <div className="w-14 h-14 bg-brand-500/20 rounded-2xl flex items-center justify-center border border-brand-500/30 backdrop-blur-md">
                                        <i className="fa-solid fa-bolt text-brand-400 text-2xl"></i>
                                    </div>
                                    <h2 className="text-2xl font-black tracking-widest text-white">TikTimer</h2>
                                </div>
                                <h1 className="text-4xl sm:text-5xl font-black text-white leading-tight mb-8">
                                    Открой всю мощь с <br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-purple-400 drop-shadow-lg">PRO версией</span>
                                </h1>
                                <ul className="space-y-5 mb-8">
                                    {['Неограниченное время сессий', 'Интерактивная рулетка призов', 'Собственные триггеры событий', 'Поддержка DonationAlerts'].map((text, i) => (
                                        <li key={i} className="flex items-center gap-4 text-slate-300 font-medium text-lg">
                                            <div className="w-8 h-8 rounded-full bg-emerald-500/10 flex items-center justify-center border border-emerald-500/20">
                                                <i className="fa-solid fa-check text-emerald-400 text-sm"></i>
                                            </div>
                                            {text}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            <div className="relative z-10 text-sm text-slate-400 bg-white/5 p-4 rounded-2xl backdrop-blur-md border border-white/5 inline-flex items-center justify-between">
                                <span>Аккаунт: <strong className="text-slate-200">{user?.email || 'test@test.com'}</strong></span>
                                <button onClick={onLogout} className="text-rose-400 hover:text-rose-300 font-bold transition">Выйти <i className="fa-solid fa-arrow-right-from-bracket ml-1"></i></button>
                            </div>
                        </div>

                        <div className="w-full md:w-1/2 p-12 bg-dark-900/50 flex flex-col items-center justify-center border-l border-white/5 backdrop-blur-xl relative">
                            <PaymentWidget user={user || {id: 1}} onVerified={onVerified} />
                        </div>
                    </div>
                </div>
            );
        }

        function MainApp({ user, subUntil, setSubUntil, onLogout }) {

                                        <h3 className="font-black text-xl text-brand-400 mb-6 flex items-center gap-3"><i className="fa-solid fa-font"></i> Типографика</h3>
                                        <label className="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-3">Главный шрифт виджета</label>
                                        <select value={config.styles.fontFamily} onChange={e=>setCfgStyle('fontFamily', e.target.value)} className="w-full input-glass rounded-xl px-5 py-4 text-lg font-bold text-white outline-none appearance-none" style={{ fontFamily: config.styles.fontFamily }}>
                                            <option value="Inter">Inter (Современный)</option>
                                            <option value="Bebas Neue">Bebas Neue (Жирный)</option>
                                            <option value="Montserrat">Montserrat (Округлый)</option>
                                            <option value="Pacifico">Pacifico (Рукописный)</option>
                                            <option value="Caveat">Caveat (Маркер)</option>
                                        </select>
                                    </div>

                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="glass-panel p-8 rounded-3xl flex flex-col gap-6">
                                            <h3 className="font-black text-xl text-emerald-400 flex items-center gap-3"><i className="fa-solid fa-palette"></i> Основные цвета</h3>
                                            <div className="flex items-center justify-between bg-dark-900/50 p-3 rounded-2xl border border-white/5">
                                                <span className="font-bold text-sm text-slate-300">Цвет Таймера</span>
                                                <input type="color" value={config.styles.timerColor} onChange={e=>setCfgStyle('timerColor', e.target.value)} className="w-12 h-12 rounded-xl cursor-pointer bg-transparent border-none p-0" />
                                            </div>
                                            <div className="bg-dark-900/50 p-4 rounded-2xl border border-white/5">
                                                <div className="flex justify-between mb-3"><span className="font-bold text-sm text-slate-300">Свечение (Glow)</span><span className="font-mono text-brand-400 font-bold">{config.styles.timerGlow}</span></div>
                                                <input type="range" min="0" max="1" step="0.1" value={config.styles.timerGlow} onChange={e=>setCfgStyle('timerGlow', parseFloat(e.target.value))} className="w-full cursor-pointer accent-brand-500 h-2 bg-dark-800 rounded-full appearance-none" />
                                            </div>
                                        </div>
                                        
                                        <div className="glass-panel p-8 rounded-3xl flex flex-col gap-6">
                                            <h3 className="font-black text-xl text-rose-400 flex items-center gap-3"><i className="fa-solid fa-bell"></i> Уведомления</h3>
                                            <div className="flex items-center justify-between bg-dark-900/50 p-3 rounded-2xl border border-white/5">
                                                <span className="font-bold text-sm text-slate-300">Цвет Плюса (+ сек)</span>
                                                <input type="color" value={config.styles.floatPlusColor || '#22c55e'} onChange={e=>setCfgStyle('floatPlusColor', e.target.value)} className="w-12 h-12 rounded-xl cursor-pointer bg-transparent border-none p-0" />
                                            </div>
                                            <div className="flex items-center justify-between bg-dark-900/50 p-3 rounded-2xl border border-white/5">
                                                <span className="font-bold text-sm text-slate-300">Цвет Минуса (- сек)</span>
                                                <input type="color" value={config.styles.floatMinusColor || '#ef4444'} onChange={e=>setCfgStyle('floatMinusColor', e.target.value)} className="w-12 h-12 rounded-xl cursor-pointer bg-transparent border-none p-0" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* OBS / Roulette Placeholder for completion */}
                            {(activeTab === 'obs' || activeTab === 'roulette') && (
                                <div className="glass-panel p-12 rounded-3xl text-center border-dashed border-white/20">
                                    <i className={`fa-solid ${activeTab === 'obs' ? 'fa-video' : 'fa-compact-disc'} text-5xl text-brand-400/50 mb-4`}></i>
                                    <h3 className="text-2xl font-bold text-white mb-2">{activeTab === 'obs' ? 'Настройки OBS' : 'Настройки Рулетки'}</h3>
                                    <p className="text-slate-400">Логика интерфейса аналогична предыдущим экранам. Дизайн обновлен под общий стиль.</p>
                                </div>
                            )}

                        </div>
                    </div>

                    {/* Floating Save Bar */}
                    {hasChanges && (
                        <div id="save-bar" className="absolute bottom-10 left-1/2 -translate-x-1/2 glass-panel p-3 rounded-full flex items-center gap-4 z-50 border border-brand-500/50 shadow-[0_10px_30px_rgba(99,102,241,0.3)]">
                            <span className="font-bold text-brand-300 ml-4 mr-2">Есть несохраненные изменения</span>
                            <button onClick={handleSave} className="px-6 py-2 bg-emerald-500 hover:bg-emerald-400 text-dark-900 rounded-full font-black transition-colors shadow-lg">СОХРАНИТЬ</button>
                            <button onClick={handleCancel} className="w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-rose-500/20 text-slate-300 hover:text-rose-400 rounded-full transition-colors"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                    )}

                    {showRenew && (
                        <div className="fixed inset-0 z-[100] bg-dark-900/90 backdrop-blur-xl flex items-center justify-center p-4">
                            <div className="glass-panel rounded-3xl p-8 w-full max-w-md relative">
                                <button onClick={() => setShowRenew(false)} className="absolute top-6 right-6 w-8 h-8 bg-white/10 rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-colors"><i className="fa-solid fa-xmark"></i></button>
                                <PaymentWidget user={user || {id:1}} onVerified={(date) => { setSubUntil(date); setShowRenew(false); }} />
                            </div>
                        </div>
                    )}

                    <GiftModal isOpen={modal.isOpen} onClose={() => setModal({ isOpen: false, key: null })} onSelect={(gift) => {
                        if (modal.key.startsWith('custom_')) { const id = modal.key.split('_')[1]; setConfig(p => ({...p, customGifts: p.customGifts.map(cg => cg.id === id ? { ...cg, gift } : cg)})); } 
                        else { setConfig({ ...config, [modal.key]: gift }); }
                    }} />
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null); 
            const [loading, setLoading] = useState(true);
            const [subUntil, setSubUntil] = useState(null);

            // Имитация загрузки для красивого показа UI, если Supabase не подключен
            useEffect(() => {
                if (!supabase) {
                    setTimeout(() => {
                        // Раскомментируйте, чтобы сразу видеть панель без авторизации при тестировании
                        // setUser({ id: 1, email: 'demo@demo.com' }); setSubUntil(new Date(Date.now() + 86400000000).toISOString());
                        setLoading(false);
                    }, 1500);
                    return;
                }

                supabase.auth.getSession().then(({ data: { session } }) => { 
                    const u = session?.user ?? null;
                    setUser(u);
                    if (u) {
                        supabase.from('ttimer_settings').select('subscription_until').eq('user_id', u.id).single().then(({data}) => {
                            setSubUntil(data ? data.subscription_until : null);
                            setLoading(false);
                        });
                    } else { setLoading(false); }
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => { 
                    const u = session?.user ?? null;
                    setUser(u);
                    if (!u) { setSubUntil(null); setLoading(false); }
                });
                return () => subscription.unsubscribe();
            }, []);

            const isSubbed = subUntil && new Date(subUntil) > new Date();

            if (loading) return (
                <div className="h-screen w-screen flex flex-col items-center justify-center bg-dark-900 text-brand-500">
                    <div className="w-16 h-16 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin"></div>
                    <span className="text-sm font-bold mt-6 tracking-widest uppercase text-slate-400">Инициализация...</span>
                </div>
            );
            
            if (!user) return <AuthScreen onLogin={(u) => { setLoading(true); window.location.reload(); }} />;
            if (!isSubbed) return <SubscriptionScreen user={user} onLogout={() => {if(supabase) supabase.auth.signOut(); else setUser(null);}} onVerified={(date) => setSubUntil(date)} />;
            
            return <MainApp user={user} subUntil={subUntil} setSubUntil={setSubUntil} onLogout={() => {if(supabase) supabase.auth.signOut(); else setUser(null);}} />;
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root')); 
        root.render(<App />);
    </script>
</body>
</html>
